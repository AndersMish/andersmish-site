<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AndersMish – Twitch, TikTok og merch</title>
  <meta name="description" content="AndersMish – norsk Twitch-streamer. 33 år gammelt barn. GTA RP på Project NXT. Finn stream, TikTok og merch her.">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="canonical" href="https://andersmish.com/">

  <!-- Open Graph / sosiale medier -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="nb_NO">
  <meta property="og:site_name" content="AndersMish">
  <meta property="og:title" content="AndersMish">
  <meta property="og:description" content="33 år gammelt barn. GTA RP på Project NXT – live på Twitch.">
  <meta property="og:url" content="https://andersmish.com/">
  <meta property="og:image" content="https://andersmish.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="AndersMish-logoen: en sølvfarget M formet som en fjelltopp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AndersMish">
  <meta name="twitter:description" content="33 år gammelt barn. GTA RP på Project NXT – live på Twitch.">
  <meta name="twitter:image" content="https://andersmish.com/assets/og-image.png">

  <!-- Ikoner -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <style>
    :root {
      --bg: #0b0b0d;
      --panel: #141417;
      --panel-hover: #1b1b1f;
      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.28);
      --silver-hi: #f4f5f7;
      --silver: #c9cdd2;
      --silver-lo: #8a9097;
      --text: #ececee;
      --muted: #9a9ca3;
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      background-image: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255, 255, 255, 0.045), transparent 70%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: calc(56px + env(safe-area-inset-top)) 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
    }

    .logo { display: block; width: 168px; height: auto; }

    h1 {
      margin: 28px 0 6px;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      /* kompenserer for letter-spacing på siste bokstav, så teksten blir visuelt sentrert */
      padding-left: 0.2em;
      text-transform: uppercase;
      background: linear-gradient(180deg, var(--silver-hi) 0%, var(--silver) 55%, var(--silver-lo) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .bio {
      margin: 0;
      font-size: 1.1rem;
      font-style: italic;
      color: var(--text);
    }

    .about {
      margin: 14px 0 0;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .about strong { color: var(--text); font-weight: 600; }

    nav {
      width: 100%;
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 64px;
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      text-align: left;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .btn:hover, .btn:focus-visible {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: var(--panel-hover);
    }
    .btn:focus-visible { outline: 2px solid var(--silver); outline-offset: 3px; }
    .btn:active { transform: translateY(0); }

    .btn .icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--silver-hi);
    }
    .btn .icon svg { width: 21px; height: 21px; }

    .btn .label { flex: 1; min-width: 0; }
    .btn .label strong { display: block; font-size: 1.05rem; font-weight: 650; }
    .btn .label span { display: block; font-size: 0.85rem; color: var(--muted); }

    .btn .arrow { flex: none; width: 18px; height: 18px; color: var(--muted); }

    /* Hovedknapp (Twitch): sølvflate med mørk tekst */
    .btn--primary {
      border-color: transparent;
      background: linear-gradient(180deg, #f2f3f5 0%, #d3d6db 100%);
      color: #111114;
    }
    .btn--primary .icon { background: rgba(0, 0, 0, 0.08); color: #111114; }
    .btn--primary .label span { color: #4b4e55; }
    .btn--primary .arrow { color: #111114; }
    .btn--primary:hover, .btn--primary:focus-visible {
      border-color: transparent;
      background: linear-gradient(180deg, #ffffff 0%, #dfe2e6 100%);
    }

    footer {
      padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
      font-size: 0.8rem;
      color: #6c6e75;
      text-align: center;
    }
    footer p { margin: 0; }

    @media (min-width: 768px) {
      main { padding-top: 72px; }
      .logo { width: 184px; }
      h1 { font-size: 2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <picture>
      <source srcset="assets/logo.webp" type="image/webp">
      <img class="logo" src="assets/logo.png" width="600" height="477" alt="AndersMish-logo: en sølvfarget M formet som en fjelltopp" decoding="async">
    </picture>

    <h1>AndersMish</h1>
    <p class="bio">«33 år gammelt barn.»</p>
    <p class="about">Norsk streamer på Twitch.<br>For tiden mest <strong>GTA&nbsp;RP</strong> på <strong>Project&nbsp;NXT</strong>.<br>Kom innom chatten!</p>

    <nav aria-label="Lenker">
      <a class="btn btn--primary" href="https://twitch.tv/andersmish" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0 1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        </span>
        <span class="label"><strong>Twitch</strong><span>Se streamen live</span></span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>

      <a class="btn" href="https://www.tiktok.com/@andersmish" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
        </span>
        <span class="label"><strong>TikTok</strong><span>Klipp og høydepunkter</span></span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>

      <!-- Merch: midlertidig Spreadshop-lenke. Byttes senere til https://merch.andersmish.com/ -->
      <a class="btn" href="https://andersmish.myspreadshop.no/" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 3.5 5.5 2 10l3 1.2V21h14v-9.8L22 10l-1.5-4.5L16 3c-.6 1.6-2.1 2.6-4 2.6S8.6 4.6 8 3z"/></svg>
        </span>
        <span class="label"><strong>Merch</strong><span>Klær og annet fra butikken</span></span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </nav>
  </main>

  <footer>
    <p>© <span id="year">2026</span> AndersMish</p>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
